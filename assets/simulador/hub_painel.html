<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Painel de grupos do hub de simuladores (só leitura). Dados injetados pelo
     modulos/simuladores_hub.py no lugar do marcador da variável D. -->
<style>
:root{--bg:#0f172a;--card:#16233b;--card2:#1b2b47;--ln:#2a3a57;--tx:#e2e8f0;--mut:#94a3b8;--tl:#2dd4bf;--tl2:#14b8a6;--or:#f69302;--or2:#ffb649;--ok:#4ade80}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.wrap{padding:2px 2px 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em}
.top h2 span{color:var(--tl)}
.src{font-size:12px;color:var(--mut)}
.src b{color:#cbd5e1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.k{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--ln);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.k:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(45,212,191,.08)}
.k small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.k b{display:block;font-size:26px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.k em{font-style:normal;font-size:12px;color:var(--mut)}
.k.o b{color:var(--or2)}.k.t b{color:var(--tl)}
.k.rot b,.k.rot em{transition:opacity .35s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#0b1324;border:1px solid var(--ln);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--mut);font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--tl2),#0f766e);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--ln);background:#0b1324;color:#cbd5e1;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
.chips button.on{border-color:var(--or);color:var(--or2);background:rgba(246,147,2,.1)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gc{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--ln);border-radius:16px;padding:12px 14px;position:relative;animation:in .45s both}
.gc .rk{position:absolute;right:12px;top:10px;font-size:12px;font-weight:900;color:var(--or2)}
.gc .gn{font-size:18px;font-weight:900}.gc .tp{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.gc .md{display:flex;align-items:baseline;gap:6px;margin:8px 0 6px}.gc .md b{font-size:26px;font-weight:900;color:var(--tl)}.gc .md span{font-size:11.5px;color:var(--mut)}
.gc .ln{display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;padding:3px 0;border-top:1px dashed #22314d}
.gc .ln i{font-style:normal;color:var(--mut)}
.meter{height:6px;border-radius:9px;background:#0b1324;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--or));border-radius:9px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=search],.tools select{background:#0b1324;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:7px 10px;font-size:13px}
.tools label{font-size:12.5px;color:#cbd5e1;display:flex;gap:6px;align-items:center}
.tbl{max-height:300px;overflow:auto;border:1px solid var(--ln);border-radius:14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:#111c31;color:var(--mut);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;cursor:pointer;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #1e2b45;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#14213a}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:800;font-size:11.5px}
.p0{background:rgba(239,68,68,.15);color:#fca5a5}.p1{background:rgba(74,222,128,.14);color:#86efac}
.vazio{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--ln);border-radius:14px}
.erro{padding:14px 16px;border-radius:14px;background:rgba(246,147,2,.1);border:1px solid rgba(246,147,2,.4);color:#fde3b5;font-size:13px}
@media(max-width:820px){.kpis,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="wrap">
<div class="top"><h2>📊 Painel de grupos · <span id="adm">—</span></h2><div class="src" id="src"></div></div>
<div class="kpis">
  <div class="k t"><small>Grupos com vaga</small><b id="kVaga">—</b><em id="kVagaS">de — grupos na base</em></div>
  <div class="k o rot" id="kRot"><small>Menor média de lance</small><b id="kMed">—</b><em id="kMedS">—</em></div>
  <div class="k"><small>Próxima assembleia</small><b id="kAss">—</b><em id="kAssS">—</em></div>
  <div class="k"><small>Contemplados no lance livre</small><b id="kCont">—</b><em>soma do período da base</em></div>
</div>
<div class="bar">
  <div class="tabs"><button class="on" data-t="top" onclick="aba(this)">🏆 Menores lances com vaga</button><button data-t="guia" onclick="aba(this)">📘 Guia de grupos</button></div>
  <div class="tools"><label title="Grupos que acabam em menos de 12 meses têm lance baixo, mas parcela muito alta"><input type="checkbox" id="semFim" checked onchange="tudo()"> ocultar fim de prazo (&lt; 12 meses)</label><div class="chips" id="chips"></div></div>
</div>
<div id="vTop"></div>
<div id="vGuia" style="display:none">
  <div class="tools">
    <input type="search" id="q" placeholder="Buscar grupo…" oninput="guia()">
    <select id="ord" onchange="guia()"><option value="media">Menor média de lance</option><option value="vagas">Mais vagas</option><option value="prazoA">Prazo menor</option><option value="prazoD">Prazo maior</option><option value="assemb">Assembleia mais próxima</option></select>
    <label><input type="checkbox" id="soVaga" checked onchange="guia()"> só com vaga</label>
  </div>
  <div class="tbl"><table><thead><tr><th>Grupo</th><th>Tipo</th><th>Vagas</th><th>Prazo</th><th>Crédito</th><th>Média lance</th><th>Menor</th><th>Maior</th><th>Contempl.</th><th>Assembleia</th><th>Obs.</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</div>
<script>
var D = "__HUB_DADOS__";
if (typeof D === "string") D = {linhas: [], meta: {adm: "—"}};
var L = D.linhas || [], M = D.meta || {}, TIPO = "";
function pct(v){ return v == null ? "—" : (Math.round(v * 100) / 100).toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 2}) + "%"; }
function k(v){ if(v == null) return "—"; return v >= 1000 ? "R$ " + (v / 1000).toLocaleString("pt-BR", {maximumFractionDigits: 0}) + " mil" : "R$ " + v.toLocaleString("pt-BR"); }
function faixa(l){ return l.cmin == null ? "—" : (l.cmin === l.cmax ? k(l.cmin) : k(l.cmin) + " – " + k(l.cmax)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function dt(s){ var m = /^(\d{2})\/(\d{2})\/(\d{2,4})/.exec(s || ""); if(!m) return null; var y = +m[3]; if(y < 100) y += 2000; return new Date(y, m[2] - 1, +m[1]); }
function filt(){ return L.filter(function(l){ return !TIPO || l.tipo === TIPO; }); }
function comVaga(l){ return (l.vagas || 0) > 0; }
function prazoOk(l){ return !document.getElementById("semFim").checked || !l.prazo || l.prazo >= 12; }

document.getElementById("adm").textContent = M.adm || "—";
document.getElementById("src").innerHTML = M.erro ? "" : "Fonte: <b>" + esc(M.fonte) + "</b>" + (M.atualizado ? " · atualizado em <b>" + esc(M.atualizado) + "</b>" : "");
if (M.erro) {
  document.getElementById("vTop").innerHTML = '<div class="erro">⚠️ Não consegui carregar os grupos desta administradora agora. O simulador abaixo continua funcionando normalmente.<br><small>' + esc(M.erro) + '</small></div>';
}
var tipos = []; L.forEach(function(l){ if(l.tipo && tipos.indexOf(l.tipo) < 0) tipos.push(l.tipo); });
if (tipos.length > 1) document.getElementById("chips").innerHTML = '<button class="on" data-v="" onclick="tipo(this)">Todos</button>' + tipos.map(function(t){ return '<button data-v="' + esc(t) + '" onclick="tipo(this)">' + esc(t) + '</button>'; }).join("");
function tipo(b){ TIPO = b.getAttribute("data-v"); [].forEach.call(document.querySelectorAll("#chips button"), function(x){ x.classList.toggle("on", x === b); }); tudo(); }
function aba(b){ [].forEach.call(document.querySelectorAll(".tabs button"), function(x){ x.classList.toggle("on", x === b); }); var t = b.getAttribute("data-t"); document.getElementById("vTop").style.display = t === "top" ? "" : "none"; document.getElementById("vGuia").style.display = t === "guia" ? "" : "none"; }

var ROT = [], RI = 0;
function kpis(){
  var F = filt(), V = F.filter(comVaga);
  document.getElementById("kVaga").textContent = V.length;
  document.getElementById("kVagaS").textContent = "de " + F.length + " grupos na base";
  ROT = V.filter(function(l){ return l.media != null && prazoOk(l); }).sort(function(a, b){ return a.media - b.media; }).slice(0, 3); RI = 0; rot();
  var hoje = new Date(); hoje.setHours(0,0,0,0); var prox = null;
  F.forEach(function(l){ var d = dt(l.assemb); if(d && d >= hoje && (!prox || d < prox.d)) prox = {d: d, g: l.g}; });
  document.getElementById("kAss").textContent = prox ? prox.d.toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"}) : "—";
  document.getElementById("kAssS").textContent = prox ? "grupo " + prox.g : "sem data na base";
  var c = 0; F.forEach(function(l){ c += +l.cont || 0; }); document.getElementById("kCont").textContent = c.toLocaleString("pt-BR");
}
function rot(){
  var b = document.getElementById("kMed"), s = document.getElementById("kMedS");
  if(!ROT.length){ b.textContent = "—"; s.textContent = "sem histórico de lance"; return; }
  var l = ROT[RI % ROT.length]; b.style.opacity = s.style.opacity = 0;
  setTimeout(function(){ b.textContent = pct(l.media); s.textContent = (RI % ROT.length + 1) + "º · grupo " + l.g + (l.tipo ? " · " + l.tipo : ""); b.style.opacity = s.style.opacity = 1; }, 200);
}
setInterval(function(){ if(ROT.length > 1){ RI++; rot(); } }, 3500);

function melhores(){
  if (M.erro) return;
  var V = filt().filter(function(l){ return comVaga(l) && l.media != null && prazoOk(l); }).sort(function(a, b){ return a.media - b.media; }).slice(0, 8);
  var el = document.getElementById("vTop");
  if(!V.length){ el.innerHTML = '<div class="vazio">Nenhum grupo com vaga e histórico de lance' + (TIPO ? " em " + esc(TIPO) : "") + ' na base agora.</div>'; return; }
  el.innerHTML = '<div class="grid">' + V.map(function(l, i){
    return '<div class="gc" style="animation-delay:' + (i * 40) + 'ms"><span class="rk">#' + (i + 1) + '</span><div class="gn">Grupo ' + esc(l.g) + '</div><div class="tp">' + esc(l.tipo || "") + '</div>'
      + '<div class="md"><b>' + pct(l.media) + '</b><span>média de lance</span></div><div class="meter"><i style="width:' + Math.min(100, l.media) + '%"></i></div>'
      + '<div class="ln" style="margin-top:8px"><i>Menor que ganhou</i><span>' + pct(l.menor) + '</span></div>'
      + '<div class="ln"><i>Vagas</i><span>' + (l.vagas == null ? "—" : l.vagas) + '</span></div>'
      + '<div class="ln"><i>Prazo</i><span>' + (l.prazo ? l.prazo + " meses" : "—") + '</span></div>'
      + '<div class="ln"><i>Crédito</i><span>' + faixa(l) + '</span></div></div>';
  }).join("") + '</div>';
}
function guia(){
  var q = document.getElementById("q").value.trim(), o = document.getElementById("ord").value, so = document.getElementById("soVaga").checked;
  var R = filt().filter(function(l){ return (!so || comVaga(l)) && (!q || String(l.g).indexOf(q) >= 0); });
  var big = 1e9, f = {
    media: function(a, b){ return (a.media == null ? big : a.media) - (b.media == null ? big : b.media); },
    vagas: function(a, b){ return (b.vagas || 0) - (a.vagas || 0); },
    prazoA: function(a, b){ return (a.prazo || big) - (b.prazo || big); },
    prazoD: function(a, b){ return (b.prazo || 0) - (a.prazo || 0); },
    assemb: function(a, b){ return ((dt(a.assemb) || big) - (dt(b.assemb) || big)); }
  };
  R.sort(f[o]);
  document.getElementById("tb").innerHTML = R.length ? R.map(function(l){
    return "<tr><td><b>" + esc(l.g) + "</b></td><td>" + esc(l.tipo) + '</td><td><span class="pill ' + (comVaga(l) ? "p1" : "p0") + '">' + (l.vagas == null ? "—" : l.vagas) + "</span></td><td>" + (l.prazo || "—") + "</td><td>" + faixa(l)
      + "</td><td><b>" + pct(l.media) + "</b></td><td>" + pct(l.menor) + "</td><td>" + pct(l.maior) + "</td><td>" + (l.cont == null ? "—" : l.cont) + "</td><td>" + esc(l.assemb || "—") + "</td><td>" + esc(l.obs || "") + "</td></tr>";
  }).join("") : '<tr><td colspan="11" style="text-align:center;color:#94a3b8;padding:20px">Nenhum grupo com esse filtro.</td></tr>';
}
function tudo(){ kpis(); melhores(); guia(); }
tudo();
</script></body></html>
